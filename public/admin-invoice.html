<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Invoice Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --ink: #17284a;
        --muted: #607089;
        --line: #d8e1ef;
        --brand: #12357f;
        --brand-dark: #091b45;
        --shadow: 0 24px 60px rgba(9, 27, 69, 0.08);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top right, rgba(18, 53, 127, 0.08), transparent 24%), linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
        color: var(--ink);
      }

      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 32px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--brand);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.76rem;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.05;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .note {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid #d7e4ff;
        background: #f5f9ff;
        color: var(--brand-dark);
      }

      .form-grid {
        margin-top: 24px;
        display: grid;
        gap: 18px;
      }

      .top-grid {
        display: grid;
        grid-template-columns: minmax(260px, 320px) 1fr;
        gap: 24px;
        align-items: start;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 15px;
        background: #fff;
        color: var(--ink);
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 4px rgba(18, 53, 127, 0.12);
      }

      .actions {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
      }

      button {
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
        color: #fff;
        padding: 14px 22px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 16px 26px rgba(18, 53, 127, 0.22);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .message {
        margin: 0;
        color: var(--muted);
      }

      .message[data-state="error"] {
        color: #b22e34;
      }

      .message[data-state="success"] {
        color: #0f7a5d;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 24px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button-secondary {
        background: #eef4ff;
        color: var(--brand);
        box-shadow: none;
      }

      .list-tools {
        margin-top: 18px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 14px;
      }

      .list-panel {
        margin-top: 18px;
        display: grid;
        gap: 14px;
      }

      .empty-state {
        padding: 18px 20px;
        border: 1px dashed var(--line);
        border-radius: 18px;
        color: var(--muted);
        background: #fbfcff;
      }

      .registration-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px 18px 16px;
        background: #fbfcff;
      }

      .registration-card__top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .registration-card__title {
        margin: 0;
        font-size: 1.05rem;
      }

      .registration-card__meta {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 20px;
      }

      .registration-card__meta p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .registration-card__meta strong {
        color: var(--ink);
      }

      .registration-card__actions {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border-radius: 999px;
        background: #eef4ff;
        border: 1px solid #d8e5ff;
        color: var(--brand);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .pill[data-tone="muted"] {
        background: #f5f7fb;
        border-color: #e1e6f0;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .page {
          padding: 24px 14px 48px;
        }

        .card {
          padding: 24px 20px;
          border-radius: 22px;
        }

        .top-grid,
        .list-tools,
        .registration-card__meta {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Admin Only</p>
        <h1>Invoice Generator</h1>
        <p class="intro">Generate a PDF tax invoice/receipt after payment verification. This page is intended for internal use only.</p>
        <p class="note">Use the submission ID from the registration record, then enter your admin token to download the PDF.</p>

        <div class="top-grid">
          <form id="invoiceAdminForm" class="form-grid" novalidate>
            <label>
              <span>Admin Token</span>
              <input id="adminTokenInput" name="adminToken" type="password" placeholder="Paste INVOICE_ADMIN_TOKEN" required />
            </label>

            <label>
              <span>Client</span>
              <select id="clientSlugInput" name="clientSlug">
                <option value="bnyc-qingdao">bnyc-qingdao</option>
              </select>
            </label>

            <label>
              <span>Manual Submission ID</span>
              <input id="submissionIdInput" name="submissionId" type="text" placeholder="BNYC-1720000000000-ABC123" />
            </label>

            <div class="actions">
              <button type="button" id="loadRegistrationsButton">Load Registrations</button>
              <button type="submit" id="generateInvoiceButton" class="button-secondary">Generate Manual PDF</button>
              <p class="message" id="invoiceAdminMessage" aria-live="polite"></p>
            </div>
          </form>

          <div>
            <div class="toolbar">
              <h2>Recent Registrations</h2>
              <div class="toolbar-actions">
                <span class="pill">Supabase Direct</span>
              </div>
            </div>

            <div class="list-tools">
              <label>
                <span>Search</span>
                <input id="registrationSearchInput" type="search" placeholder="Search by name, email, invoice name or submission ID" />
              </label>
              <label>
                <span>Invoice Filter</span>
                <select id="invoiceFilterInput">
                  <option value="all">All registrations</option>
                  <option value="invoice-only">Invoice requested only</option>
                </select>
              </label>
            </div>

            <div class="list-panel" id="registrationList"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="./admin-invoice.js"></script>
  </body>
</html>
