<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/success.html" />
    <script>
      const target = new URL("/success.html", window.location.origin);
      target.search = window.location.search;
      window.location.replace(target.toString());
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
        color: #17284a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      p {
        margin: 0;
        text-align: center;
        line-height: 1.7;
      }

      a {
        color: #12357f;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecting to the registration confirmation page.
      If nothing happens, <a href="/success.html">open it here</a>.
    </p>
  </body>
</html>
